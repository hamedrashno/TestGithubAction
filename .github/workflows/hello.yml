# نام workflow
name: Hello Workflow

# رویداد اجرا
on:
  push:
    branches: [ main ]

jobs:
  build:                          # job اول
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create file         # ساخت یک فایل خروجی
        run: echo "built at $(date)" > build.txt

      - name: Upload artifact     # آپلود فایل به‌عنوان artifact
        uses: actions/upload-artifact@v4
        with:                     # ورودی‌های اکشن
          name: build-output      # نام artifact
          path: build.txt         # مسیر فایل یا پوشه

  deploy:                         # job دوم
    runs-on: ubuntu-latest
    needs: build                  # بعد از موفقیت build
    steps:
      - name: Download artifact   # دانلود artifact ساخته‌شده در job قبل
        uses: actions/download-artifact@v4
        with:
          name: build-output      # همان نام artifact

      - name: Show file           # نمایش محتوای فایل دانلودشده
        run: cat build.txt