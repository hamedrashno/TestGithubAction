# نام workflow که در تب Actions نمایش داده می‌شود
name: Hello Workflow

# رویدادهایی که باعث اجرای این workflow می‌شوند
on:
  push: # وقتی push انجام شود
    branches: [main] # فقط روی شاخه main

# لیست job ها
jobs:
  say-hello: # نام job (دلخواه)
    runs-on: ubuntu-latest # ماشین مجازی که job روی آن اجرا می‌شود
    steps: # لیست step ها (به ترتیب اجرا می‌شوند)
      - name: Checkout code # نام این step
        uses: actions/checkout@v4 # اکشن آماده: کد ریپو را روی ماشین کپی می‌کند

      - name: List files # نام این step
        run: ls -la # دستور شل: لیست فایل‌های پوشه فعلی

      - name: Show index.html # نام این step
        run: cat index.html # دستور شل: نمایش محتوای فایل index.html

      - name: Print Hamed
        run: echo "Hello from Hamed"
