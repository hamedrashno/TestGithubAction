# نام workflow
name: Hello Workflow

# رویداد اجرا
on:
  push:
    branches: [ main ]

jobs:
  build:                          # job اول
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build step           # شبیه‌سازی build
        run: echo "Building..."

  deploy:                         # job دوم
    runs-on: ubuntu-latest
    needs: build                  # فقط بعد از موفقیت job build اجرا می‌شود
    steps:
      - name: Deploy step         # شبیه‌سازی deploy
        run: echo "Deploying after build succeeded"