name: Deploy Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch: # فقط فعال‌سازی اجرای دستی

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build artifact
        run: echo "built at $(date)" > build.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build.txt

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    environment: staging          # به environment staging وصل می‌شود
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Deploy to staging
        run: echo "Deploying to staging with token: ${#DEPLOY_TOKEN} chars"
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}   # secret مخصوص staging

  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging          # production بعد از staging موفق
    environment: production        # اینجا منتظر تأیید انسانی می‌ماند
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Deploy to production
        run: echo "Deploying to production with token: ${#DEPLOY_TOKEN} chars"
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}   # secret مخصوص production