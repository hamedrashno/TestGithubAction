name: Deploy to IIS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare site files
        run: |
          mkdir -p site
          cp index.html site/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-files
          path: site/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: site-files
          path: site

      - name: Copy files to server (SCP)
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "site/"
          target: "/c/Deploy/my-actions-project/incoming"
          tar_dereference: true
          overwrite: true

      - name: Run deploy script (SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: powershell -ExecutionPolicy Bypass -File "C:\Deploy\my-actions-project\deploy.ps1"
